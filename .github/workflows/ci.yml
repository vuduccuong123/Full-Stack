name: CI for Multiple Branches

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  REGISTRY_DH: docker.io
  DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: myapp-backend
  FRONTEND_IMAGE: myapp-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Compute IMAGE_TAG (branch + short SHA)
      - name: Compute IMAGE_TAG
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "IMAGE_TAG=${GITHUB_REF_NAME}-${SHORT_SHA}v" >> $GITHUB_ENV

      # 3. Login DockerHub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Ensure Backend Repo Exists
      - name: Ensure Backend Repo Exists
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ env.DH_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" | jq -r .token)
          curl -s -X POST "https://hub.docker.com/v2/repositories/${{ env.DH_USERNAME }}/${{ env.BACKEND_IMAGE }}/" \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT $TOKEN" \
            -d '{"name": "'${{ env.BACKEND_IMAGE }}'", "is_private": false}' || echo "Repo may already exist"

      # 5. Ensure Frontend Repo Exists
      - name: Ensure Frontend Repo Exists
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ env.DH_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" | jq -r .token)
          curl -s -X POST "https://hub.docker.com/v2/repositories/${{ env.DH_USERNAME }}/${{ env.FRONTEND_IMAGE }}/" \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT $TOKEN" \
            -d '{"name": "'${{ env.FRONTEND_IMAGE }}'", "is_private": false}' || echo "Repo may already exist"

      # 6. Build & push backend image with auto tag
      - name: Build & Push Backend
        uses: docker/build-push-action@v3
        with:
          context: api
          push: true
          tags: ${{ env.REGISTRY_DH }}/${{ env.DH_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # 7. Build & push frontend image with auto tag
      - name: Build & Push Frontend
        uses: docker/build-push-action@v3
        with:
          context: view
          push: true
          tags: ${{ env.REGISTRY_DH }}/${{ env.DH_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # 8. Optional: Run Backend Unit Tests
      - name: Run Backend Unit Tests
        continue-on-error: true
        run: dotnet test api/tests/

      # 9. Optional: Run Frontend Build/Test
      - name: Run Frontend Build & Tests
        continue-on-error: true
        run: |
          cd view
          npm ci
          npm run build
          npm test

      # 10. Optional: Trivy scan & upload reports
      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Trivy Scan & Upload Reports
        continue-on-error: true
        run: |
          trivy image --format json --output trivy-be.json ${{ env.REGISTRY_DH }}/${{ env.DH_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          trivy image --format json --output trivy-fe.json ${{ env.REGISTRY_DH }}/${{ env.DH_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-be.json
            trivy-fe.json
